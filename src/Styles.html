<style>
/* ==========================================================================
   ระบบลงเวลาปฏิบัติงานออนไลน์ โรงเรียนวัดเสาหิน — Design System
   Mobile-first · Navy Blue / Sky Blue / White · ภาษาไทย (Sarabun / Prompt)
   ========================================================================== */
:root {
  --navy-900: #0B2545;
  --navy-800: #13315C;
  --navy-700: #1B4F8A;
  --navy-600: #24609F;
  --sky-500: #2E9BE0;
  --sky-400: #4FB3F0;
  --sky-200: #BFE3FA;
  --sky-100: #E3F2FD;
  --sky-50: #F2F9FE;
  --white: #FFFFFF;
  --bg: #F3F6FB;
  --surface: #FFFFFF;
  --border: #DCE4EE;
  --border-strong: #C5D2E2;
  --text: #0F172A;
  --text-2: #334155;
  --muted: #64748B;
  --success: #15803D;
  --success-500: #16A34A;
  --success-bg: #DCFCE7;
  --danger: #B91C1C;
  --danger-500: #DC2626;
  --danger-bg: #FEE2E2;
  --warning: #B45309;
  --warning-bg: #FEF3C7;
  --info-bg: #E0F2FE;
  /* สีกราฟ (ตรวจสอบความแตกต่างสำหรับผู้มีภาวะตาบอดสีแล้ว) */
  --c-ontime: #0CA30C;
  --c-leave: #2A78D6;
  --c-late: #EDA100;
  --c-absent: #D03B3B;
  --c-notyet: #94A3B8;
  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
  --shadow: 0 4px 16px rgba(11, 37, 69, .08);
  --shadow-lg: 0 12px 40px rgba(11, 37, 69, .18);
  --font: 'Sarabun', 'Noto Sans Thai', 'Leelawadee UI', 'Tahoma', sans-serif;
  --font-head: 'Prompt', 'Sarabun', 'Noto Sans Thai', 'Tahoma', sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: 1rem; line-height: 1.55; color: var(--text);
  background: var(--bg); -webkit-font-smoothing: antialiased; min-height: 100vh;
}
h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 600; line-height: 1.3; margin: 0 0 .5rem; color: var(--navy-900); }
h1 { font-size: 1.5rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.08rem; } h4 { font-size: 1rem; }
p { margin: 0 0 .75rem; }
a { color: var(--navy-700); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky-400); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }

/* Material Symbols */
.ms {
  font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1;
  letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr;
  -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
  font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; vertical-align: middle; overflow: hidden;
  width: 1em; flex-shrink: 0;
}
.ms.fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }

/* ---------- Layout ---------- */
.view { min-height: 100vh; }
.container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.stack > * + * { margin-top: 16px; }
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row-between { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.tiny { font-size: .78rem; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.mt-0 { margin-top: 0 !important; }
.mb-0 { margin-bottom: 0 !important; }

/* ---------- Boot / loading ---------- */
.boot {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: linear-gradient(160deg, var(--navy-900), var(--navy-700) 60%, var(--sky-500)); color: #fff; z-index: 100; text-align: center; padding: 24px;
}
.boot .brand-mark { width: 72px; height: 72px; font-size: 40px; }
.spinner {
  width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .35); border-top-color: #fff;
  animation: spin .8s linear infinite;
}
.spinner.dark { border-color: var(--sky-100); border-top-color: var(--navy-700); }
.spinner.sm { width: 18px; height: 18px; border-width: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay {
  position: fixed; inset: 0; background: rgba(11, 37, 69, .35); z-index: 90; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.loading-box { background: #fff; border-radius: var(--radius); padding: 22px 28px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-lg); font-weight: 600; color: var(--navy-800); }

/* ---------- Brand ---------- */
.brand-mark {
  width: 44px; height: 44px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, var(--sky-400), var(--navy-700)); color: #fff; font-size: 26px; box-shadow: 0 6px 18px rgba(46, 155, 224, .35);
}
.brand-mark .ms { font-size: inherit; }

/* ---------- Auth pages (Login / Register) ---------- */
.auth-hero {
  background: radial-gradient(1200px 400px at 80% -10%, rgba(79, 179, 240, .55), transparent 60%),
              linear-gradient(160deg, var(--navy-900) 0%, var(--navy-800) 55%, var(--navy-700) 100%);
  color: #fff; padding: 36px 16px 96px; text-align: center; position: relative; overflow: hidden;
}
.auth-hero::after {
  content: ''; position: absolute; left: -10%; right: -10%; bottom: -60px; height: 120px; background: var(--bg); border-radius: 50% 50% 0 0;
}
.auth-hero .brand-mark { width: 68px; height: 68px; font-size: 38px; border-radius: 20px; margin-bottom: 14px; }
.auth-hero h1 { color: #fff; font-size: 1.45rem; margin-bottom: 4px; }
.auth-hero .school { font-size: 1.05rem; color: var(--sky-200); font-weight: 600; }
.auth-hero .en { font-size: .82rem; letter-spacing: .02em; opacity: .8; margin-top: 2px; }
.auth-hero .slogan {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 6px 14px; border-radius: 999px;
  background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22); font-size: .86rem;
}
.auth-wrap { max-width: 460px; margin: -72px auto 0; padding: 0 16px 40px; position: relative; z-index: 2; }
.auth-card { padding: 24px 20px; }
.auth-card h2 { display: flex; align-items: center; gap: 8px; }
.auth-footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 20px; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; margin: 18px 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); border: 1px solid rgba(220, 228, 238, .7);
  padding: 18px;
}
.card-title { display: flex; align-items: center; gap: 8px; font-family: var(--font-head); font-weight: 600; color: var(--navy-900); font-size: 1.05rem; margin: 0 0 12px; }
.card-title .ms { color: var(--sky-500); }
.card-sub { color: var(--muted); font-size: .88rem; margin-top: -6px; margin-bottom: 12px; }
.card.flat { box-shadow: var(--shadow-sm); }
.card.tint { background: var(--sky-50); border-color: var(--sky-100); }

.stat-card { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); position: relative; min-height: 98px; }
.stat-card .stat-icon { width: 36px; height: 36px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; background: var(--sky-100); color: var(--navy-700); }
.stat-card .stat-value { font-family: var(--font-head); font-size: 1.7rem; font-weight: 600; color: var(--navy-900); line-height: 1.1; }
.stat-card .stat-unit { font-size: .85rem; color: var(--muted); font-weight: 500; margin-left: 4px; font-family: var(--font); }
.stat-card .stat-label { font-size: .86rem; color: var(--text-2); }
.stat-card.clickable { cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
.stat-card.clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.tone-success .stat-icon { background: var(--success-bg); color: var(--success); }
.tone-danger .stat-icon { background: var(--danger-bg); color: var(--danger); }
.tone-warning .stat-icon { background: var(--warning-bg); color: var(--warning); }
.tone-sky .stat-icon { background: var(--info-bg); color: #0369A1; }
.tone-muted .stat-icon { background: #EEF2F7; color: var(--muted); }
.tone-navy .stat-icon { background: var(--sky-100); color: var(--navy-800); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px;
  border-radius: 12px; border: 1px solid transparent; background: var(--navy-800); color: #fff; font-weight: 600; cursor: pointer;
  text-decoration: none; transition: background .15s ease, transform .05s ease, box-shadow .15s ease; user-select: none; -webkit-tap-highlight-color: transparent;
}
.btn:hover { background: var(--navy-700); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn.is-loading { opacity: .6; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.lg { min-height: 54px; font-size: 1.05rem; border-radius: 14px; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
.btn.sky { background: var(--sky-500); }
.btn.sky:hover { background: #1F87CA; }
.btn.success { background: var(--success-500); }
.btn.success:hover { background: var(--success); }
.btn.danger { background: var(--danger-500); }
.btn.danger:hover { background: var(--danger); }
.btn.outline { background: #fff; color: var(--navy-800); border-color: var(--border-strong); }
.btn.outline:hover { background: var(--sky-50); border-color: var(--sky-400); }
.btn.ghost { background: transparent; color: var(--navy-800); }
.btn.ghost:hover { background: var(--sky-50); }
.btn.white { background: #fff; color: var(--navy-800); }
.btn .spinner { width: 18px; height: 18px; border-width: 2px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px; border: 0; background: transparent; color: inherit; display: inline-flex;
  align-items: center; justify-content: center; cursor: pointer;
}
.icon-btn:hover { background: rgba(255, 255, 255, .12); }
.link-btn { background: none; border: 0; color: var(--navy-700); font-weight: 600; cursor: pointer; padding: 4px; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Attendance big buttons ---------- */
.att-actions { display: grid; grid-template-columns: 1fr; gap: 12px; }
.att-btn {
  position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 88px; padding: 16px 18px; border: 0; border-radius: 20px;
  color: #fff; cursor: pointer; text-align: left; box-shadow: 0 10px 24px rgba(11, 37, 69, .18); transition: transform .08s ease, filter .15s ease;
  -webkit-tap-highlight-color: transparent;
}
.att-btn:active { transform: scale(.985); }
.att-btn .att-icon { width: 54px; height: 54px; border-radius: 16px; background: rgba(255, 255, 255, .18); display: inline-flex; align-items: center; justify-content: center; }
.att-btn .att-icon .ms { font-size: 32px; }
.att-btn .att-text { display: flex; flex-direction: column; }
.att-btn .att-title { font-family: var(--font-head); font-size: 1.25rem; font-weight: 600; }
.att-btn .att-sub { font-size: .88rem; opacity: .9; }
.att-btn.in { background: linear-gradient(135deg, #15803D, #16A34A 60%, #22C55E); }
.att-btn.out { background: linear-gradient(135deg, var(--navy-800), var(--navy-700) 55%, var(--sky-500)); }
.att-btn[disabled] { filter: grayscale(.85); opacity: .55; cursor: not-allowed; box-shadow: none; }
.att-btn .done-mark { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; background: rgba(255, 255, 255, .2); border-radius: 999px; padding: 4px 10px; font-size: .85rem; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label, .field-label { font-weight: 600; font-size: .92rem; color: var(--text-2); }
.field .hint { font-size: .8rem; color: var(--muted); }
.field .err { font-size: .82rem; color: var(--danger); display: none; }
.field.has-error .err { display: block; }
.field.has-error .input, .field.has-error input, .field.has-error select, .field.has-error textarea { border-color: var(--danger-500); background: #FFF7F7; }
.input, .field input:not([type]), .field input[type=text], .field input[type=password], .field input[type=date], .field input[type=time], .field input[type=number],
.field input[type=search], .field select, .field textarea {
  width: 100%; min-height: 48px; padding: 10px 14px; border: 1.5px solid var(--border-strong); border-radius: 12px; background: #fff;
  font-size: max(16px, 1rem); transition: border-color .15s ease, box-shadow .15s ease; -webkit-appearance: none; appearance: none;
}
.field select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.field textarea { min-height: 96px; resize: vertical; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--sky-500); box-shadow: 0 0 0 4px rgba(46, 155, 224, .18); }
.input-icon { position: relative; }
.input-icon > .ms { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.input-icon input { padding-left: 44px !important; }
.input-icon .toggle-pw { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 10px; }
.input-icon .toggle-pw:hover { background: var(--sky-50); color: var(--navy-700); }
.input-icon.has-toggle input { padding-right: 50px !important; }
.check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: .92rem; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--navy-700); flex-shrink: 0; }
.form-grid { display: grid; grid-template-columns: 1fr; gap: 0 14px; }
.seg { display: inline-flex; background: #EEF2F7; padding: 4px; border-radius: 12px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font-weight: 600; color: var(--text-2); cursor: pointer; min-height: 40px; }
.seg button.active { background: #fff; color: var(--navy-800); box-shadow: var(--shadow-sm); }
.radio-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.radio-cards label { border: 1.5px solid var(--border-strong); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; min-height: 50px; }
.radio-cards input { accent-color: var(--navy-700); width: 18px; height: 18px; }
.radio-cards label:has(input:checked) { border-color: var(--sky-500); background: var(--sky-50); }
.pw-meter { height: 6px; border-radius: 6px; background: #E2E8F0; overflow: hidden; }
.pw-meter > span { display: block; height: 100%; width: 0; transition: width .25s ease, background .25s ease; }
.pw-rules { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; font-size: .82rem; color: var(--muted); }
.pw-rules li { display: flex; align-items: center; gap: 6px; }
.pw-rules li .ms { font-size: 18px; }
.pw-rules li.ok { color: var(--success); }
.file-drop { border: 1.5px dashed var(--border-strong); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 10px; background: #FAFCFF; cursor: pointer; }
.file-drop:hover { border-color: var(--sky-400); }
.file-drop input { display: none; }
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 46px; height: 26px; border-radius: 999px; background: #CBD5E1; position: relative; transition: background .2s; flex-shrink: 0; }
.switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform .2s; }
.switch input:checked + .track { background: var(--success-500); }
.switch input:checked + .track::after { transform: translateX(20px); }
.switch input:focus-visible + .track { outline: 3px solid var(--sky-400); outline-offset: 2px; }

/* ---------- ปุ่มประเภทการลา (แตะครั้งเดียว) ---------- */
.leave-types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.leave-type-btn {
  display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 12px; border-radius: 16px; border: 1.5px solid var(--border-strong);
  background: #fff; cursor: pointer; text-align: left; font-weight: 700; color: var(--navy-900); transition: border-color .15s, background .15s, transform .05s;
  -webkit-tap-highlight-color: transparent;
}
.leave-type-btn:hover { border-color: var(--sky-400); background: var(--sky-50); }
.leave-type-btn:active { transform: scale(.98); }
.leave-type-btn .lt-icon { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--sky-100); color: var(--navy-700); flex-shrink: 0; }
.leave-type-btn[data-type="SICK"] .lt-icon { background: var(--danger-bg); color: var(--danger); }
.leave-type-btn[data-type="PERSONAL"] .lt-icon { background: var(--warning-bg); color: var(--warning); }
.leave-type-btn[data-type="VACATION"] .lt-icon { background: var(--success-bg); color: var(--success); }
.leave-type-btn[data-type="MATERNITY"] .lt-icon { background: #FCE7F3; color: #9D174D; }
.leave-type-btn[data-type="OFFICIAL"] .lt-icon { background: var(--sky-100); color: var(--navy-700); }
.leave-type-btn[data-type="OTHER"] .lt-icon { background: #EEF2F7; color: var(--text-2); }
.leave-type-btn.selected { border-color: var(--sky-500); background: var(--sky-50); box-shadow: 0 0 0 3px rgba(46, 155, 224, .18); }
.leave-summary { background: var(--sky-50); border: 1px solid var(--sky-100); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
.leave-summary .big { font-family: var(--font-head); font-size: 1.15rem; font-weight: 600; color: var(--navy-900); }

/* ---------- Badges / chips ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; line-height: 1.5; white-space: nowrap; background: #EEF2F7; color: var(--text-2); }
.badge .ms { font-size: 16px; }
.badge.success { background: var(--success-bg); color: var(--success); }
.badge.danger { background: var(--danger-bg); color: var(--danger); }
.badge.warning { background: var(--warning-bg); color: var(--warning); }
.badge.info { background: var(--info-bg); color: #075985; }
.badge.navy { background: var(--sky-100); color: var(--navy-800); }
.badge.muted { background: #EEF2F7; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .14); color: #fff; font-size: .85rem; }

/* ---------- Alerts ---------- */
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-size: .92rem; border: 1px solid transparent; }
.alert .ms { margin-top: 1px; }
.alert.info { background: var(--info-bg); color: #075985; border-color: #BAE6FD; }
.alert.success { background: var(--success-bg); color: var(--success); border-color: #BBF7D0; }
.alert.warning { background: var(--warning-bg); color: var(--warning); border-color: #FDE68A; }
.alert.danger { background: var(--danger-bg); color: var(--danger); border-color: #FECACA; }

/* ---------- App bar & navigation ---------- */
.appbar {
  position: sticky; top: 0; z-index: 30; background: linear-gradient(120deg, var(--navy-900), var(--navy-800) 60%, var(--navy-700));
  color: #fff; box-shadow: 0 2px 12px rgba(11, 37, 69, .25);
}
.appbar .container { display: flex; align-items: center; gap: 10px; min-height: 62px; }
.appbar .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.appbar .brand .brand-mark { width: 38px; height: 38px; font-size: 22px; border-radius: 11px; box-shadow: none; }
.appbar .brand-text { display: flex; flex-direction: column; min-width: 0; }
.appbar .brand-title { font-family: var(--font-head); font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar .brand-sub { font-size: .75rem; color: var(--sky-200); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar .user-chip { display: none; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: rgba(255, 255, 255, .1); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(145deg, var(--sky-400), var(--sky-500)); color: #fff; font-weight: 700; font-family: var(--font-head); font-size: .95rem; flex-shrink: 0; }
.avatar.lg { width: 56px; height: 56px; font-size: 1.35rem; }
.app-main { padding: 16px 0 calc(96px + var(--safe-bottom)); }
.tabnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff; border-top: 1px solid var(--border);
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(6px + var(--safe-bottom)); box-shadow: 0 -4px 16px rgba(11, 37, 69, .06);
}
.tabnav button {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; color: var(--muted);
  font-size: .72rem; font-weight: 600; cursor: pointer; border-radius: 12px; position: relative; min-height: 54px;
}
.tabnav button .ms { font-size: 24px; }
.tabnav button.active { color: var(--navy-800); }
.tabnav button.active .ms { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; color: var(--sky-500); }
.tabnav .dot { position: absolute; top: 4px; right: calc(50% - 20px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--danger-500); color: #fff; font-size: .68rem; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.page-head h2 { margin: 0; display: flex; align-items: center; gap: 8px; }
.page-head h2 .ms { color: var(--sky-500); }

/* ---------- Dashboard widgets ---------- */
.hello { display: flex; align-items: center; gap: 14px; }
.hello .name { font-family: var(--font-head); font-size: 1.15rem; font-weight: 600; color: var(--navy-900); }
.clock-card { background: linear-gradient(140deg, var(--navy-900), var(--navy-700) 70%, var(--sky-500)); color: #fff; border: 0; position: relative; overflow: hidden; }
.clock-card::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255, 255, 255, .07); }
.clock-card .date { font-size: .98rem; color: var(--sky-200); }
.clock-card .time { font-family: var(--font-head); font-size: 2.7rem; font-weight: 600; letter-spacing: .02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.clock-card .work-hours { font-size: .86rem; opacity: .9; margin-top: 4px; }
.clock-card .src { font-size: .72rem; opacity: .7; }
.today-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.today-slot { border-radius: 14px; padding: 12px; background: var(--sky-50); border: 1px solid var(--sky-100); }
.today-slot .lbl { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--text-2); font-weight: 600; }
.today-slot .val { font-family: var(--font-head); font-size: 1.6rem; font-weight: 600; color: var(--navy-900); font-variant-numeric: tabular-nums; }
.today-slot .val.empty { color: #A0AEC0; }
.gps-row { display: flex; align-items: center; gap: 12px; }
.gps-pulse { width: 46px; height: 46px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: #EEF2F7; color: var(--muted); }
.gps-pulse.ok { background: var(--success-bg); color: var(--success); }
.gps-pulse.bad { background: var(--danger-bg); color: var(--danger); }
.gps-pulse.wait { background: var(--warning-bg); color: var(--warning); }
.zone-result { margin-top: 12px; padding: 12px 14px; border-radius: 12px; display: flex; gap: 10px; align-items: flex-start; }
.zone-result.in { background: var(--success-bg); color: var(--success); }
.zone-result.out { background: var(--danger-bg); color: var(--danger); }
.zone-result .big { font-family: var(--font-head); font-size: 1.15rem; font-weight: 600; }
.list { display: flex; flex-direction: column; gap: 10px; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #fff; border: 1px solid var(--border); }
.list-item .date-box { width: 52px; text-align: center; border-radius: 12px; background: var(--sky-50); padding: 6px 0; flex-shrink: 0; }
.list-item .date-box .d { font-family: var(--font-head); font-size: 1.25rem; font-weight: 600; color: var(--navy-800); line-height: 1.1; }
.list-item .date-box .m { font-size: .72rem; color: var(--muted); }
.list-item .body { flex: 1; min-width: 0; }
.list-item .times { display: flex; gap: 14px; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-2); flex-wrap: wrap; }
.list-item .times span { display: inline-flex; align-items: center; gap: 4px; }
.list-item .times .ms { font-size: 18px; color: var(--muted); }
.req-card { border: 1px solid var(--border); border-radius: 14px; padding: 14px; background: #fff; }
.req-card .head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.req-card .title { font-weight: 700; color: var(--navy-900); }
.req-card .meta { font-size: .84rem; color: var(--muted); margin-top: 4px; }
.req-card .reason { margin-top: 8px; font-size: .92rem; background: #F8FAFC; border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
.req-card .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.empty-state { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty-state .ms { font-size: 44px; color: var(--sky-200); display: block; margin: 0 auto 6px; width: auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: .95rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; word-break: break-word; }

/* ---------- Tables ---------- */
.table-wrap { width: 100%; overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); background: #fff; -webkit-overflow-scrolling: touch; }
table.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th { background: var(--navy-800); color: #fff; font-weight: 600; text-align: left; padding: 10px 12px; white-space: nowrap; position: sticky; top: 0; }
.table td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: middle; }
.table tbody tr:nth-child(even) td { background: #F8FBFE; }
.table tbody tr:hover td { background: var(--sky-50); }
.table .c { text-align: center; }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.table .actions { white-space: nowrap; }
@media (max-width: 719px) {
  table.table.stack-mobile thead { display: none; }
  table.table.stack-mobile, .table.stack-mobile tbody, .table.stack-mobile tr, .table.stack-mobile td { display: block; width: 100%; }
  .table.stack-mobile tr { border-top: 1px solid var(--border); padding: 8px 4px; }
  .table.stack-mobile tbody tr:nth-child(even) td { background: transparent; }
  .table.stack-mobile td { border: 0; padding: 4px 10px; display: flex; justify-content: space-between; gap: 12px; text-align: right !important; }
  .table.stack-mobile td::before { content: attr(data-label); font-weight: 600; color: var(--muted); text-align: left; flex-shrink: 0; }
  .table.stack-mobile td.full { display: block; text-align: left !important; }
  .table.stack-mobile td.full::before { display: block; margin-bottom: 4px; }
}

/* ---------- Toast ---------- */
/* ข้อความแจ้งเตือนอยู่ใต้แถบเมนูด้านบน และไม่บังการแตะปุ่มใด ๆ (pointer-events: none) */
.toast-host { position: fixed; left: 50%; transform: translateX(-50%); top: 70px; z-index: 120; display: flex; flex-direction: column; gap: 8px; width: min(94vw, 440px); pointer-events: none; }
.toast { pointer-events: none; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--navy-900); color: #fff; box-shadow: var(--shadow-lg); animation: toastIn .25s ease; font-size: .95rem; }
.toast.success { background: #14532D; }
.toast.error { background: #7F1D1D; }
.toast.warning { background: #78350F; }
.toast .ms { margin-top: 1px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* ---------- Modal ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(11, 37, 69, .5); z-index: 100; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .2s ease; }
.modal {
  background: #fff; width: 100%; max-height: 92vh; overflow: auto; border-radius: 22px 22px 0 0; box-shadow: var(--shadow-lg);
  animation: slideUp .25s ease; padding-bottom: var(--safe-bottom);
}
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; position: sticky; top: 0; background: #fff; z-index: 1; }
.modal-head h3 { margin: 0; flex: 1; }
.modal-head .icon-btn { color: var(--muted); }
.modal-head .icon-btn:hover { background: #F1F5F9; }
.modal-body { padding: 8px 18px 16px; }
.modal-actions { display: flex; gap: 10px; padding: 12px 18px 18px; flex-wrap: wrap; justify-content: flex-end; }
.modal-actions .btn { flex: 1 1 140px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }
.result-hero { text-align: center; padding: 6px 0 4px; }
.result-hero .ring { width: 84px; height: 84px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.result-hero .ring .ms { font-size: 52px; width: auto; }
.result-hero.ok .ring { background: var(--success-bg); color: var(--success); }
.result-hero.bad .ring { background: var(--danger-bg); color: var(--danger); }
.result-hero .big-time { font-family: var(--font-head); font-size: 2.2rem; font-weight: 600; color: var(--navy-900); font-variant-numeric: tabular-nums; }
.steps { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 10px; }
.steps li { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.steps li .st { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #EEF2F7; flex-shrink: 0; }
.steps li .st .ms { font-size: 18px; }
.steps li.active { color: var(--navy-800); font-weight: 600; }
.steps li.active .st { background: var(--sky-100); }
.steps li.done { color: var(--success); }
.steps li.done .st { background: var(--success-bg); }
.steps li.fail { color: var(--danger); }
.steps li.fail .st { background: var(--danger-bg); }
.help-list { padding-left: 20px; margin: 6px 0 12px; }
.help-list li { margin-bottom: 6px; }
.temp-pass { font-family: 'Courier New', monospace; font-size: 1.5rem; font-weight: 700; letter-spacing: .08em; background: var(--sky-50); border: 1.5px dashed var(--sky-400); border-radius: 12px; padding: 12px; text-align: center; color: var(--navy-900); user-select: all; }

/* ---------- Charts ---------- */
.chart-box { position: relative; height: 260px; }
.chart-box.tall { height: 320px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .86rem; color: var(--text-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.segbar { display: flex; height: 28px; border-radius: 8px; overflow: hidden; background: #EEF2F7; gap: 2px; }
.segbar > div { height: 100%; min-width: 0; transition: flex-grow .4s ease; }
.segbar-legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 16px; margin-top: 14px; }
.segbar-legend .it { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--text-2); white-space: nowrap; padding: 4px 0; border-bottom: 1px dashed var(--border); }
.segbar-legend .it i { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.segbar-legend .it b { margin-left: auto; color: var(--text); font-variant-numeric: tabular-nums; }

/* ---------- Footer / misc ---------- */
.privacy-box { font-size: .88rem; color: var(--text-2); background: #F8FAFC; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.privacy-box h4 { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
/* ---------- สถิติการลา ---------- */
.select-sm { width: auto; min-height: 38px; padding: 6px 30px 6px 10px; font-size: .88rem; border-radius: 10px; }
.table.compact th { padding: 8px 8px; font-size: .82rem; white-space: normal; line-height: 1.25; }
.table.compact td { padding: 8px 8px; font-size: .88rem; }
.stats-table th .th-sub { font-weight: 400; font-size: .72rem; opacity: .85; }
.stats-table th.cur { background: var(--sky-500); }
.stats-table td:first-child { font-weight: 600; white-space: nowrap; }
.stats-table td.muted { color: var(--muted); }

/* ---------- ประกาศถึงบุคลากร ---------- */
.announce-card { display: flex; align-items: flex-start; gap: 12px; padding: 12px 8px 12px 16px; border-radius: 18px; background: #EEF6FF; border: 1.5px solid var(--sky-200); color: var(--navy-900); }
.announce-card > .ms { font-size: 28px; color: var(--sky-500); margin-top: 2px; }
.announce-card .an-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.announce-card .an-text { white-space: pre-wrap; word-break: break-word; font-size: 1.02rem; line-height: 1.5; }
.announce-card .tiny { color: var(--muted); }
.announce-card .icon-btn { color: var(--muted); width: 36px; height: 36px; }

/* ---------- งานรออนุมัติ (ผู้บริหาร) ---------- */
.approvals-card { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 18px; color: #fff;
  background: linear-gradient(135deg, #B45309, #D97706); box-shadow: var(--shadow-sm); }
.approvals-card > .ms { font-size: 30px; }
.approvals-card .ap-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.approvals-card .ap-text .small { opacity: .95; }

/* ---------- วันที่ลงเวลาไม่ครบ ---------- */
.issues-card { border: 1.5px solid #F5C451; background: #FFFBEB; }

.issue-row:first-child { border-top: 0; padding-top: 2px; }
.issue-info { display: flex; flex-direction: column; min-width: 0; }
.issue-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- คำแนะนำ / เครื่องนี้ ---------- */
.home-tip { display: flex; align-items: center; gap: 10px; background: var(--sky-50); border: 1px solid var(--sky-100); border-radius: 16px; padding: 10px 10px 10px 14px; }
.home-tip > .ms { color: var(--sky-500); font-size: 28px; }
.home-tip .tip-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.home-tip .tip-text .small { color: var(--text-2); }
.home-tip .icon-btn { color: var(--muted); }
.device-box { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin: 14px 0; background: #F8FAFC; }
.device-row { display: flex; gap: 10px; align-items: flex-start; }
.device-row > .ms { color: var(--sky-500); }
ol.howto { margin: 12px 0; padding-left: 22px; }
ol.howto li { margin: 6px 0; line-height: 1.5; }
ol.howto .ms { font-size: 18px; vertical-align: -3px; color: var(--navy-700); }
/* ปุ่มลัดใต้ปุ่มลงเวลา */
.quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick-links button { display: flex; align-items: center; gap: 8px; justify-content: center; min-height: 48px; border-radius: 14px; border: 1px solid var(--border); background: #fff; color: var(--navy-800); font-weight: 600; cursor: pointer; padding: 8px 10px; font-size: .92rem; line-height: 1.25; text-align: left; }
.quick-links button .ms { color: var(--sky-500); }
.quick-links button:active { background: var(--sky-50); }
.footer-note { text-align: center; color: var(--muted); font-size: .78rem; padding: 18px 0 6px; }
.print-area { display: none; }

/* ---------- Tablet / Desktop ---------- */
@media (max-width: 559px) { .hide-xs { display: none; } }
/* มือถือ: ปุ่มลงเวลาอยู่ถัดจากนาฬิกาทันที (ไม่ต้องเลื่อนหา) */
@media (max-width: 899px) {
  .home-main { display: flex; flex-direction: column; gap: 16px; }
  .home-main > .stack { display: contents; }
  .home-main > .stack > * { margin-top: 0 !important; }
  .o-hello { order: 1; } .o-clock { order: 2; } .o-actions { order: 3; } .o-geo { order: 4; } .o-today { order: 5; } .o-gps { order: 6; } .o-tip { order: 7; } .o-quick { order: 3; }
  .o-hello { padding: 14px 16px; }
}
@media (min-width: 560px) {
  .grid-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .att-actions { grid-template-columns: 1fr 1fr; }
  .leave-types { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .form-grid.two { grid-template-columns: 1fr 1fr; }
  .modal-backdrop { align-items: center; padding: 20px; }
  .modal { border-radius: 22px; max-width: 560px; }
  .modal.wide { max-width: 860px; }
}
@media (min-width: 900px) {
  .grid-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-stats.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .appbar .user-chip { display: inline-flex; }
  .app-main { padding-bottom: 40px; }
  .tabnav {
    position: sticky; top: 62px; bottom: auto; z-index: 25; display: flex; justify-content: center; gap: 6px; padding: 8px 16px;
    border-top: 0; border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .tabnav button { flex-direction: row; gap: 8px; font-size: .95rem; padding: 8px 16px; min-height: 44px; }
  .tabnav button.active { background: var(--sky-50); }
  .tabnav .dot { position: static; }
  .home-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; align-items: start; }
  .home-grid > .stack { margin-top: 0; }
  .auth-hero { padding-top: 56px; }
}

/* ---------- Print (รายงาน) ---------- */
@media print {
  @page { size: A4 landscape; margin: 12mm; }
  body { background: #fff !important; }
  body.printing > *:not(#printArea) { display: none !important; }
  body.printing #printArea { display: block !important; }
  .print-doc { font-family: 'Sarabun', 'TH Sarabun New', Tahoma, sans-serif; color: #000; font-size: 12.5pt; }
  .print-doc .p-school { text-align: center; font-size: 17pt; font-weight: 700; }
  .print-doc .p-title { text-align: center; font-size: 15pt; font-weight: 700; margin-top: 2px; }
  .print-doc .p-meta { text-align: center; font-size: 11.5pt; margin-top: 2px; }
  .print-doc h4 { font-size: 12.5pt; margin: 14px 0 6px; color: #000; }
  .print-doc table { width: 100%; border-collapse: collapse; margin-top: 4px; page-break-inside: auto; }
  .print-doc th, .print-doc td { border: 1px solid #555; padding: 4px 6px; font-size: 11pt; }
  .print-doc th { background: #E5ECF5 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .print-doc tr { page-break-inside: avoid; }
  .print-doc .c { text-align: center; }
  .print-doc .p-summary { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 18px; font-size: 11.5pt; }
  /* บัญชีลงเวลาปฏิบัติราชการ (แบบสมุดลงเวลา) */
  .sb-doc { font-family: 'Sarabun', 'TH Sarabun New', Tahoma, sans-serif; color: #000; font-size: 11.5pt; }
  .sb-doc .sb-title { text-align: center; font-size: 16pt; font-weight: 700; }
  .sb-doc .sb-sub { text-align: center; font-size: 13pt; font-weight: 600; }
  .sb-doc .sb-meta { text-align: center; font-size: 10.5pt; margin: 2px 0 8px; }
  .sb-table { width: 100%; border-collapse: collapse; }
  .sb-table th, .sb-table td { border: 1px solid #333; padding: 3px 5px; font-size: 10.5pt; line-height: 1.3; }
  .sb-table th { background: #EEF2F7 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sb-table thead { display: table-header-group; }
  .sb-table tr { page-break-inside: avoid; }
  .sb-table .c { text-align: center; }
  .sb-table tr.sb-red td { border-top: 2.5px solid #D00 !important; border-bottom: 2.5px solid #D00 !important; color: #D00; text-align: center; font-weight: 700; font-size: 9.5pt; padding: 1px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sb-table tr.sb-gap td { background: #F5F5F5 !important; font-weight: 700; font-size: 9.5pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sb-doc .sb-sum { margin-top: 8px; font-size: 11pt; }
  .sb-doc .sb-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 22px; text-align: center; font-size: 11pt; line-height: 1.7; page-break-inside: avoid; }
