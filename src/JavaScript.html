<script>
/* ==========================================================================
   JavaScript.html — Client หลัก (บุคลากร): Auth, ลงเวลา GPS, ประวัติ, การลา, คำร้อง
   หมายเหตุความปลอดภัย: โค้ดฝั่ง Browser ไม่ใช่จุดตรวจสิทธิ์ — Server ตรวจ Session/Role
   ทุกคำสั่งเสมอ การแก้ไข JavaScript ใน DevTools จึงไม่สามารถเพิ่มสิทธิ์ได้
   ========================================================================== */
(function () {
  'use strict';

  var META = window.APP_META || {};
  var S = {
    token: null, user: null, cfg: null, offsetMs: 0, timeoutMin: 30, lastApi: Date.now(), lastPing: 0,
    dash: null, attBusy: false, adminLoaded: false, clockTimer: null, tab: 'home', loadedTabs: {}
  };

  /* ------------------------------------------------------------------ utils */
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function icon(name, cls) { return '<span class="ms' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' + esc(name) + '</span>'; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  var TH_M = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  var TH_MS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var TH_D = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
  function parseYmd(s) { var p = String(s || '').split('-'); return { y: +p[0], m: +p[1], d: +p[2] }; }
  function dowOf(s) { var p = parseYmd(s); return new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay(); }
  function thDate(s, style) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s || ''))) return '';
    var p = parseYmd(s);
    if (style === 'short') return p.d + ' ' + TH_MS[p.m - 1] + ' ' + String(p.y + 543).slice(-2);
    if (style === 'long') return 'วัน' + TH_D[dowOf(s)] + 'ที่ ' + p.d + ' ' + TH_M[p.m - 1] + ' พ.ศ. ' + (p.y + 543);
    if (style === 'dow') return TH_D[dowOf(s)] + ' ' + p.d + ' ' + TH_MS[p.m - 1] + ' ' + (p.y + 543);
    return p.d + ' ' + TH_M[p.m - 1] + ' ' + (p.y + 543);
  }
  function hm(t) { return t ? String(t).substr(0, 5) : ''; }
  function initials(name) {
    var n = String(name || '').replace(/^(นาย|นางสาว|นาง|น\.ส\.|ด\.ต\.|ว่าที่ร้อยตรี|ดร\.)\s*/, '').trim();
    return n ? n.charAt(0) : 'ค';
  }
  /** เวลา Bangkok ตามนาฬิกา Server (ใช้แสดงผลเท่านั้น — Server เป็นผู้บันทึกเวลาจริง) */
  function serverNow() { return Date.now() + S.offsetMs; }
  function bkkParts(ms) {
    var d = new Date(ms + 7 * 3600000);
    return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), hh: d.getUTCHours(), mi: d.getUTCMinutes(), ss: d.getUTCSeconds(), dow: d.getUTCDay() };
  }
  function bkkToday() { var p = bkkParts(serverNow()); return p.y + '-' + pad2(p.m) + '-' + pad2(p.d); }
  function bkkTimeHM() { var p = bkkParts(serverNow()); return pad2(p.hh) + ':' + pad2(p.mi); }
  function fmtDistance(m) { if (m === null || m === undefined || m === '') return '-'; m = Number(m); return m >= 1000 ? (m / 1000).toFixed(2) + ' กม.' : Math.round(m) + ' ม.'; }

  /* ------------------------------------------------------------------ storage */
  function safeStore(kind) {
    var mem = {};
    return {
      get: function (k) { try { return window[kind].getItem(k); } catch (e) { return mem[k] || null; } },
      set: function (k, v) { try { window[kind].setItem(k, v); } catch (e) { mem[k] = v; } },
      del: function (k) { try { window[kind].removeItem(k); } catch (e) { delete mem[k]; } }
    };
  }
  var session = safeStore('sessionStorage');
  var local = safeStore('localStorage');

  /* ------------------------------------------------------------------ RPC */
  function run(fn, args) {
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        reject(appErr('ไม่สามารถเชื่อมต่อ Google Apps Script ได้ กรุณาเปิดผ่าน URL ของเว็บแอป', 'NO_GAS'));
        return;
      }
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(appErr('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', 'NETWORK', null, e));
      });
      r[fn].apply(r, args || []);
    });
  }
  function appErr(message, code, data, cause) {
    var e = new Error(message); e.code = code || 'ERROR'; e.data = data || null; e.cause = cause; return e;
  }
  /** เรียกคำสั่งที่ต้องเข้าสู่ระบบ */
  function api(action, params, opts) {
    opts = opts || {};
    if (!opts.silent) showLoading(opts.loadingText);
    return run('api', [S.token, action, params || {}]).then(function (res) {
      if (!opts.silent) hideLoading();
      if (!res) throw appErr('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์', 'EMPTY');
      if (!res.ok) {
        if (res.code === 'AUTH' && !opts.retried && S.token && hasDevice() && action !== 'auth.logout') {
          // เครื่องที่จำการเข้าสู่ระบบไว้: เข้าสู่ระบบใหม่อัตโนมัติแล้วทำคำสั่งเดิมต่อ
          return silentResume().then(function (ok) {
            if (ok) return api(action, params, { silent: opts.silent, loadingText: opts.loadingText, retried: true });
            forceLogout(res.error);
            throw appErr(res.error, res.code, res.data);
          });
        }
        if (res.code === 'AUTH') { forceLogout(res.error); }
        else if (res.code === 'MUST_CHANGE_PASSWORD') { showView('force-password'); }
        throw appErr(res.error, res.code, res.data);
      }
      S.lastApi = Date.now();
      return res.data;
    }, function (e) { if (!opts.silent) hideLoading(); throw e; });
  }

  /* ---------- จำการเข้าสู่ระบบบนเครื่องนี้ ---------- */
  function hasDevice() { return !!local.get('wsh_device'); }
  function clientInfo(extra) {
    var o = { ua: navigator.userAgent.substr(0, 240) };
    if (extra) Object.keys(extra).forEach(function (k) { o[k] = extra[k]; });
    return o;
  }
  /** เข้าสู่ระบบใหม่เงียบ ๆ ด้วยรหัสอุปกรณ์ที่จำไว้ → Promise<boolean> (เรียกพร้อมกันหลายจุดใช้ผลเดียวกัน) */
  function silentResume() {
    var dev = local.get('wsh_device');
    if (!dev) return Promise.resolve(false);
    if (!S.resuming) {
      S.resuming = run('resumeSession', [dev, clientInfo()]).then(function (res) {
        S.resuming = null;
        if (res && res.ok) {
          S.token = res.data.token; session.set('wsh_token', S.token); S.lastApi = Date.now();
          S.timeoutMin = res.data.sessionTimeoutMin || S.timeoutMin;
          return res.data;
        }
        if (res && res.code === 'AUTH') local.del('wsh_device');
        return false;
      }, function () { S.resuming = null; return false; });
    }
    return S.resuming;
  }
  function setDevice(dev) { if (dev) local.set('wsh_device', dev); else local.del('wsh_device'); }
  /* ---------- ขนาดตัวอักษร (เก็บในเครื่องนี้) ---------- */
  var FONT_SCALES = ['1', '1.125', '1.25'];
  function applyFontScale(v) {
    if (FONT_SCALES.indexOf(v) < 0) v = '1';
    document.documentElement.style.fontSize = v === '1' ? '' : (parseFloat(v) * 100) + '%';
    $$('#fontSizeSeg button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-val') === v); });
  }
  function bindFontScale() {
    applyFontScale(local.get('wsh_font') || '1');
    $$('#fontSizeSeg button').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-val');
        local.set('wsh_font', v); applyFontScale(v);
        toast('เปลี่ยนขนาดตัวอักษรแล้ว', 'success', 1800);
      });
    });
  }
  /** ค่าเริ่มต้นของช่อง "จำการเข้าสู่ระบบ": เลือกไว้บนโทรศัพท์/แท็บเล็ต ไม่เลือกบนคอมพิวเตอร์ */
  function rememberDefault() {
    var pref = local.get('wsh_remember');
    if (pref === '1' || pref === '0') return pref === '1';
    try { return window.matchMedia('(pointer: coarse)').matches; } catch (e) { return false; }
  }
  function publicCall(fn, args, loadingText) {
    showLoading(loadingText);
    return run(fn, args).then(function (res) {
      hideLoading();
      if (!res) throw appErr('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์', 'EMPTY');
      if (!res.ok) throw appErr(res.error, res.code, res.data);
      return res.data;
    }, function (e) { hideLoading(); throw e; });
  }

  /* ------------------------------------------------------------------ UI primitives */
  var loadingCount = 0;
  function showLoading(text) { loadingCount++; $('#loadingText').textContent = text || 'กำลังประมวลผล...'; $('#loadingOverlay').hidden = false; }
  function hideLoading() { loadingCount = Math.max(0, loadingCount - 1); if (!loadingCount) $('#loadingOverlay').hidden = true; }

  function toast(msg, type, ms) {
    var icons = { success: 'check_circle', error: 'error', warning: 'warning', info: 'info' };
    var el = document.createElement('div');
    el.className = 'toast ' + (type || 'info');
    el.setAttribute('role', type === 'error' ? 'alert' : 'status');
    el.innerHTML = icon(icons[type] || 'info') + '<div>' + esc(msg) + '</div>';
    $('#toastHost').appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(function () { el.remove(); }, 320); }, ms || 3800);
  }

  /**
   * modal({title, icon, body (HTML), actions: [{label, cls, icon, onClick(close), keepOpen}], wide, onClose})
   */
  function modal(o) {
    var host = $('#modalHost');
    var back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.title || '') + '">' +
      '<div class="modal-head">' + (o.icon ? icon(o.icon) : '') + '<h3>' + esc(o.title || '') + '</h3>' +
      (o.noClose ? '' : '<button type="button" class="icon-btn" data-close aria-label="ปิด">' + icon('close') + '</button>') + '</div>' +
      '<div class="modal-body">' + (o.body || '') + '</div>' +
      (o.actions && o.actions.length ? '<div class="modal-actions"></div>' : '') + '</div>';
    var closed = false;
    function close(v) {
      if (closed) return; closed = true;
      back.remove();
      document.removeEventListener('keydown', onKey);
      if (o.onClose) o.onClose(v);
    }
    function onKey(e) { if (e.key === 'Escape' && !o.noClose) close(); }
    document.addEventListener('keydown', onKey);
    if (!o.noClose) {
      back.addEventListener('click', function (e) { if (e.target === back) close(); });
      $('[data-close]', back).addEventListener('click', function () { close(); });
    }
    if (o.actions) {
      var bar = $('.modal-actions', back);
      o.actions.forEach(function (a) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn ' + (a.cls || '');
        b.innerHTML = (a.icon ? icon(a.icon) : '') + esc(a.label);
        b.addEventListener('click', function () {
          if (a.onClick) {
            var r = a.onClick(close, b, back);
            if (r === false || a.keepOpen) return;
          }
          close(a.value);
        });
        bar.appendChild(b);
      });
    }
    host.appendChild(back);
    var focusEl = $('input, select, textarea', back) || $('.modal-actions .btn', back);
    if (focusEl) setTimeout(function () { try { focusEl.focus(); } catch (e) { /* ignore */ } }, 50);
    if (o.onOpen) o.onOpen(back, close);
    return { close: close, root: back };
  }

  function confirmDialog(o) {
    return new Promise(function (resolve) {
      var answered = false;
      modal({
        title: o.title || 'ยืนยัน', icon: o.icon || (o.danger ? 'warning' : 'help'),
        body: '<p>' + (o.html || esc(o.message || '')) + '</p>',
        actions: [
          { label: o.cancelText || 'ยกเลิก', cls: 'outline', onClick: function () { answered = true; resolve(false); } },
          { label: o.confirmText || 'ยืนยัน', cls: o.danger ? 'danger' : '', icon: o.confirmIcon, onClick: function () { answered = true; resolve(true); } }
        ],
        onClose: function () { if (!answered) resolve(false); }
      });
    });
  }

  /** ขอข้อความจากผู้ใช้ (เช่น เหตุผลไม่อนุมัติ) → string หรือ null */
  function promptDialog(o) {
    return new Promise(function (resolve) {
      var done = false;
      modal({
        title: o.title, icon: o.icon || 'edit_note',
        body: (o.message ? '<p>' + esc(o.message) + '</p>' : '') +
          '<div class="field"><label for="promptInput">' + esc(o.label || 'ข้อความ') + '</label>' +
          '<textarea id="promptInput" maxlength="500" placeholder="' + esc(o.placeholder || '') + '"></textarea>' +
          '<span class="err"></span></div>',
        actions: [
          { label: 'ยกเลิก', cls: 'outline', onClick: function () { done = true; resolve(null); } },
          {
            label: o.confirmText || 'ตกลง', cls: o.danger ? 'danger' : '', onClick: function (close, btn, root) {
              var v = $('#promptInput', root).value.trim();
              if (o.required && v.length < 2) {
                var f = $('.field', root); f.classList.add('has-error'); $('.err', f).textContent = 'กรุณากรอก' + (o.label || 'ข้อความ');
                return false;
              }
              done = true; resolve(v);
            }
          }
        ],
        onClose: function () { if (!done) resolve(null); }
      });
    });
  }

  function setBtnLoading(btn, on) {
    if (!btn) return;
    if (on) {
      btn.dataset.html = btn.innerHTML; btn.disabled = true; btn.classList.add('is-loading');
      btn.innerHTML = '<span class="spinner"></span>กำลังดำเนินการ...';
    } else if (btn.dataset.html !== undefined) {
      btn.innerHTML = btn.dataset.html; btn.disabled = false; btn.classList.remove('is-loading'); delete btn.dataset.html;
    }
  }

  function clearFieldErrors(form) { $$('.field.has-error', form).forEach(function (f) { f.classList.remove('has-error'); }); }
  function showFieldError(form, field, msg) {
    var f = field ? $('.field[data-field="' + field + '"]', form) : null;
    if (!f) return false;
    f.classList.add('has-error');
    var e = $('.err', f); if (e) e.textContent = msg;
    var inp = $('input, select, textarea', f); if (inp && inp.focus) { try { inp.focus(); } catch (x) { /* ignore */ } }
    return true;
  }
  function handleFormError(form, err) {
    if (!(err.data && err.data.field && showFieldError(form, err.data.field, err.message))) toast(err.message, 'error', 5500);
  }

  var BADGE = {
    PRESENT: ['success', 'check_circle'], LATE: ['warning', 'schedule'], LEAVE: ['info', 'event_busy'], ABSENT: ['danger', 'cancel'],
    NOT_YET: ['muted', 'hourglass_empty'], HOLIDAY: ['muted', 'beach_access'], HOLIDAY_WORK: ['navy', 'work_history'],
    ON_TIME: ['success', 'check_circle'], NORMAL: ['success', 'check_circle'], EARLY: ['warning', 'running_with_errors'],
    PENDING: ['warning', 'pending'], APPROVED: ['success', 'verified'], REJECTED: ['danger', 'block'], CANCELLED: ['muted', 'do_not_disturb_on'],
    ACTIVE: ['success', 'check_circle'], INACTIVE: ['muted', 'person_off']
  };
  function badge(code, label) {
    var b = BADGE[code] || ['muted', 'info'];
    return '<span class="badge ' + b[0] + '">' + icon(b[1]) + esc(label || code) + '</span>';
  }
  function emptyState(text, ic) { return '<div class="empty-state">' + icon(ic || 'inbox') + '<div>' + esc(text) + '</div></div>'; }

  /** ไฟล์แนบ → {name, mimeType, data(base64)} พร้อมย่อรูปภาพให้เล็กลง */
  function fileToPayload(file) {
    return new Promise(function (resolve, reject) {
      if (!file) { resolve(null); return; }
      var okTypes = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'];
      if (okTypes.indexOf(file.type) < 0) { reject(appErr('รองรับเฉพาะไฟล์ PDF, JPG, PNG, WEBP', 'VALIDATION', { field: 'attachment' })); return; }
      var finish = function (blob, name, type) {
        if (blob.size > 5 * 1024 * 1024) { reject(appErr('ไฟล์แนบต้องมีขนาดไม่เกิน 5 MB', 'VALIDATION', { field: 'attachment' })); return; }
        var fr = new FileReader();
        fr.onload = function () { resolve({ name: name, mimeType: type, data: String(fr.result).split(',')[1] }); };
        fr.onerror = function () { reject(appErr('อ่านไฟล์ไม่สำเร็จ', 'VALIDATION', { field: 'attachment' })); };
        fr.readAsDataURL(blob);
      };
      if (file.type.indexOf('image/') === 0 && file.size > 700 * 1024) {
        var img = new Image(), url = URL.createObjectURL(file);
        img.onload = function () {
          var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          c.toBlob(function (b) { finish(b || file, file.name.replace(/\.\w+$/, '') + '.jpg', b ? 'image/jpeg' : file.type); }, 'image/jpeg', 0.82);
        };
        img.onerror = function () { URL.revokeObjectURL(url); finish(file, file.name, file.type); };
        img.src = url;
      } else {
        finish(file, file.name, file.type);
      }
    });
  }

  function base64ToBlob(b64, mime) {
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }
  function downloadBase64(b64, mime, name) {
    var url = URL.createObjectURL(base64ToBlob(b64, mime));
    var a = document.createElement('a');
    // ต้องระบุ target เป็น _self: หน้าเว็บใช้ <base target="_top"> ซึ่งจะทำให้ลิงก์ดาวน์โหลดไปเปิดที่หน้าต่างแม่ (นอก iframe ของ Apps Script)
    a.href = url; a.download = name; a.target = '_self'; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 5000);
  }

  /** คัดลอกข้อความ (สำรองด้วย execCommand เมื่อ Clipboard API ใช้ไม่ได้ใน iframe) */
  function copyText(text, okMsg) {
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      toast(ok ? (okMsg || 'คัดลอกแล้ว') : 'คัดลอกไม่สำเร็จ กรุณากดค้างที่ข้อความแล้วเลือกคัดลอก', ok ? 'success' : 'warning');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg || 'คัดลอกแล้ว', 'success'); }, fallback);
    } else fallback();
  }

  /** ดูไฟล์แนบ (ตรวจสิทธิ์ที่ Server) */
  function viewAttachment(kind, id) {
    api('file.get', { kind: kind, id: id }, { loadingText: 'กำลังโหลดเอกสาร...' }).then(function (f) {
      var url = URL.createObjectURL(base64ToBlob(f.base64, f.mimeType));
      var isImg = f.mimeType.indexOf('image/') === 0;
      modal({
        title: f.name, icon: 'description', wide: true,
        body: isImg ? '<img src="' + url + '" alt="' + esc(f.name) + '" style="max-width:100%;border-radius:12px">'
          : '<div class="alert info">' + icon('picture_as_pdf') + '<div>เอกสาร PDF — กดปุ่มด้านล่างเพื่อดาวน์โหลดและเปิดดู</div></div>',
        actions: [{ label: 'ดาวน์โหลด', icon: 'download', cls: 'outline', keepOpen: true, onClick: function () { downloadBase64(f.base64, f.mimeType, f.name); } },
          { label: 'ปิด' }],
        onClose: function () { setTimeout(function () { URL.revokeObjectURL(url); }, 1000); }
      });
    }).catch(function (e) { toast(e.message, 'error'); });
  }

  /** โหลด Chart.js เฉพาะเมื่อต้องใช้ (ประหยัดข้อมูลบนมือถือ) */
  var chartPromise = null;
  function loadChartJs() {
    if (window.Chart) return Promise.resolve(window.Chart);
    if (!chartPromise) {
      chartPromise = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
        s.onload = function () { if (window.Chart) { window.Chart.defaults.font.family = "'Sarabun', sans-serif"; resolve(window.Chart); } else reject(new Error('Chart.js')); };
        s.onerror = function () { chartPromise = null; reject(new Error('โหลด Chart.js ไม่สำเร็จ')); };
        document.head.appendChild(s);
      });
    }
    return chartPromise;
  }

  /* ------------------------------------------------------------------ boot */
  function boot() {
    bindStatic();
    bindFontScale();
    $('#bootText').textContent = 'กำลังเชื่อมต่อเซิร์ฟเวอร์...';
    run('getPublicConfig', []).then(function (res) {
      if (!res || !res.ok) throw appErr(res ? res.error : 'โหลดข้อมูลไม่สำเร็จ');
      S.cfg = res.data;
      S.offsetMs = res.data.serverNow - Date.now();
      applyMeta(S.cfg);
      $('#setupNotice').hidden = !!S.cfg.setupComplete;
      $('#registerArea').hidden = !S.cfg.allowRegistration;
      if (S.cfg.needsFirstAdmin) { showSetup(); return; }
      var token = session.get('wsh_token');
      if (token && S.cfg.setupComplete) {
        S.token = token;
        return api('auth.session', {}, { silent: true }).then(enterApp).catch(function () { clearSession(); showLogin(); });
      }
      if (hasDevice() && S.cfg.setupComplete) {
        $('#bootText').textContent = 'กำลังเข้าสู่ระบบอัตโนมัติ...';
        return silentResume().then(function (data) {
          if (data) enterApp(data);
          else { showLogin(); showLoginAlert(hasDevice() ? 'เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่ หรือเข้าสู่ระบบด้วยรหัสผ่าน' : 'กรุณาเข้าสู่ระบบอีกครั้ง (การจำเครื่องนี้สิ้นสุดแล้ว)'); }
        });
      }
      showLogin();
    }).catch(function (e) {
      showLogin();

      if (e.target.closest('[data-logout]')) { doLogout(); return; }

  /* ------------------------------------------------------------------ auth */
  function doLogin(e) {
    e.preventDefault();
    showLoginAlert('');
    var u = $('#loginUsername').value.trim(), p = $('#loginPassword').value;
    if (!u || !p) { showLoginAlert('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return; }
    var btn = $('#loginBtn');
    setBtnLoading(btn, true);
    var remember = $('#rememberMe').checked && !$('#rememberMe').closest('label').hidden;
    run('login', [u, p, clientInfo({ remember: remember })]).then(function (res) {
      setBtnLoading(btn, false);
      if (!res || !res.ok) { showLoginAlert(res ? res.error : 'เข้าสู่ระบบไม่สำเร็จ'); $('#loginPassword').select(); return; }
      local.set('wsh_remember', remember ? '1' : '0');
      if (remember) local.set('wsh_user', u); else local.del('wsh_user');
      setDevice(res.data.device);
      $('#loginPassword').value = '';
      S.token = res.data.token;
      session.set('wsh_token', S.token);
      enterApp(res.data);
    }).catch(function (err) { setBtnLoading(btn, false); showLoginAlert(err.message); });
  }

  function enterApp(data) {
    S.user = data.user;
    S.timeoutMin = data.sessionTimeoutMin || 30;
    S.lastApi = Date.now();
    S.loadedTabs = {};
    S.adminLoaded = false;
    $('#adminRoot').innerHTML = '';
    if (data.mustChangePassword || (data.user && data.user.mustChangePassword)) {
      $('#forcePwForm').reset();
      showView('force-password');
      return;
    }
    renderUserChrome();
    renderDeviceBox();
    renderHomeTip();
    showView('app');
    switchTab('home', true);
  }

  function renderUserChrome() {
    var u = S.user;
    var ini = initials(u.fullName);
    ['#appAvatar', '#homeAvatar', '#accAvatar'].forEach(function (s) { $(s).textContent = ini; });
    $('#appUserName').textContent = u.fullName;
    $('#homeName').textContent = u.fullName;
    $('#homePosition').textContent = u.position;
    $('#homeRole').textContent = u.roleLabel;
    $('#accName').textContent = u.fullName;
    $('#accRole').textContent = u.roleLabel + ' · ' + u.position;
    $('#accCode').textContent = u.staffCode;
    $('#accPosition').textContent = u.position;
    $('#accUsername').textContent = u.username;
    $('#toAdminBtn').hidden = !(u.role === 'ADMIN' || u.role === 'EXECUTIVE');
  }

  function clearSession() {
    S.token = null; S.user = null; S.dash = null; session.del('wsh_token');
    if (S.clockTimer) { clearInterval(S.clockTimer); S.clockTimer = null; }
    $('#modalHost').innerHTML = '';
    $('#adminRoot').innerHTML = '';
    S.adminLoaded = false;
    if (window.Admin && window.Admin.destroy) { try { window.Admin.destroy(); } catch (e) { /* ignore */ } }
  }

  function forceLogout(msg) {
    if (!S.token) return;
    clearSession();
    showLogin();
    showLoginAlert(msg || 'หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่');
  }

  /* ---------- ติดตั้งครั้งแรก ---------- */
  function showSetup() {
    if (S.cfg.dbFileName) $('#setupDbName').textContent = S.cfg.dbFileName;
    if (S.cfg.setupSheetName) $('#setupSheetName').textContent = S.cfg.setupSheetName;
    showView('setup');
  }
  function doFirstRun(e) {
    e.preventDefault();
    var f = $('#setupForm');
    clearFieldErrors(f);
    $('#setupAlert').hidden = true;
    var data = {
      setupCode: $('#suCode').value.trim(), fullName: $('#suName').value.trim(),
      position: $('#suPos').value, username: $('#suUser').value.trim().toLowerCase(),
      password: $('#suPw').value, confirmPassword: $('#suPw2').value,
      settings: {
        SCHOOL_LAT: $('#suLat').value.trim(), SCHOOL_LNG: $('#suLng').value.trim(),
        WORK_START_TIME: $('#suStart').value, LATE_AFTER_TIME: $('#suLate').value, WORK_END_TIME: $('#suEnd').value,
        SETTINGS_CONFIRMED: $('#suConfirm').checked && !!$('#suLat').value.trim()
      },
      clientInfo: { ua: navigator.userAgent.substr(0, 240) }
    };
    if (data.setupCode.replace(/[^A-Za-z0-9]/g, '').length < 12) return showFieldError(f, 'setupCode', 'กรุณากรอกรหัสติดตั้ง 12 ตัวจากชีต "เริ่มต้นใช้งาน"');
    if (data.password !== data.confirmPassword) return showFieldError(f, 'confirmPassword', 'การยืนยันรหัสผ่านไม่ตรงกัน');
    var btn = $('#setupBtn');
    setBtnLoading(btn, true);
    run('firstRunSetup', [data]).then(function (res) {
      setBtnLoading(btn, false);
      if (!res || !res.ok) {
        var err = appErr(res ? res.error : 'ติดตั้งไม่สำเร็จ', res && res.code, res && res.data);
        if (err.code === 'ALREADY_SETUP') { S.cfg.needsFirstAdmin = false; showLogin(); showLoginAlert(err.message); return; }
        if (!(err.data && err.data.field && showFieldError(f, err.data.field, err.message))) { $('#setupAlertText').textContent = err.message; $('#setupAlert').hidden = false; window.scrollTo(0, 0); }
        return;
      }
      S.cfg.needsFirstAdmin = false;
      S.token = res.data.token;
      session.set('wsh_token', S.token);
      f.reset();
      toast(res.data.message, 'success', 5000);
      enterApp(res.data);
    }).catch(function (err) { setBtnLoading(btn, false); $('#setupAlertText').textContent = err.message; $('#setupAlert').hidden = false; });
  }
  function setupUseMyLocation() {
    var b = $('#suMyLoc');
    setBtnLoading(b, true);

    acquirePosition(15, function (best) { $('#suLocNote').textContent = 'ความแม่นยำ ±' + Math.round(best.accuracy) + ' ม.'; }).then(function (p) {
      $('#suLat').value = p.lat.toFixed(6); $('#suLng').value = p.lng.toFixed(6);
      $('#suLocNote').textContent = 'ได้ตำแหน่งแล้ว (±' + Math.round(p.accuracy) + ' ม.)';

  function doLogout() {
    confirmDialog({ title: 'ออกจากระบบ', message: hasDevice() ? 'ต้องการออกจากระบบใช่หรือไม่ (เครื่องนี้จะเลิกจำการเข้าสู่ระบบ ครั้งหน้าต้องใส่รหัสผ่าน)' : 'ต้องการออกจากระบบใช่หรือไม่', confirmText: 'ออกจากระบบ', icon: 'logout' }).then(function (yes) {
      if (!yes) return;
      var t = S.token;
      setDevice(null);
      clearSession();
      showLogin();
      if (t) run('api', [t, 'auth.logout', {}]).catch(function () { /* ignore */ });
      toast('ออกจากระบบเรียบร้อยแล้ว', 'success');
    });
  }

  function onUserActivity() {
    if (!S.token || !S.user) return;
    var now = Date.now();
    if (now - S.lastApi > 60000 && now - S.lastPing > 120000 && now - S.lastApi < S.timeoutMin * 60000) {
      S.lastPing = now;
      api('auth.ping', {}, { silent: true }).catch(function () { /* handled */ });
    }
  }
  function checkIdle() {
    // เครื่องที่จำการเข้าสู่ระบบไว้: ไม่ต้องออกจากระบบ ระบบจะเข้าสู่ระบบใหม่ให้อัตโนมัติเมื่อใช้งาน

  /* ---------- Register ---------- */
  function resetRegister() {
    $('#registerForm').reset();
    clearFieldErrors($('#registerForm'));
    $('#registerAlert').hidden = true;
    $('#registerCard').hidden = false;
    $('#registerDone').hidden = true;
    updatePwRules();
  }
  function pwRuleState() {
    var pw = $('#regPassword').value, cf = $('#regConfirm').value, u = $('#regUsername').value.trim().toLowerCase();
    return {
      len: pw.length >= 8,
      mix: /[A-Za-z]/.test(pw) && /\d/.test(pw),
      user: pw.length > 0 && !(u.length >= 4 && pw.toLowerCase().indexOf(u) >= 0),
      match: pw.length > 0 && pw === cf
    };
  }
  function updatePwRules() {
    var st = pwRuleState();
    $$('#regPwRules li').forEach(function (li) {
      var ok = st[li.getAttribute('data-rule')];
      li.classList.toggle('ok', ok);
      $('.ms', li).textContent = ok ? 'check_circle' : 'radio_button_unchecked';
    });
    var pw = $('#regPassword').value;
    var score = 0;
    if (pw.length >= 8) score++;
    if (pw.length >= 12) score++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
    if (/\d/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    var colors = ['#DC2626', '#DC2626', '#F59E0B', '#F59E0B', '#16A34A', '#15803D'];
    var m = $('#regPwMeter');
    m.style.width = (pw ? Math.max(12, score * 20) : 0) + '%';
    m.style.background = colors[score];
  }
  function doRegister(e) {
    e.preventDefault();
    var f = $('#registerForm');
    clearFieldErrors(f);
    $('#registerAlert').hidden = true;
    var data = {
      fullName: f.fullName.value.trim(), position: f.position.value, // รหัสประจำตัวบุคลากร: ระบบกำหนดให้อัตโนมัติ
      username: f.username.value.trim().toLowerCase(), password: f.password.value, confirmPassword: f.confirmPassword.value,
      acceptPrivacy: $('#regAccept').checked
    };
    var st = pwRuleState();
    if (!data.fullName) return showFieldError(f, 'fullName', 'กรุณากรอกชื่อ-นามสกุล');
    if (!data.position) return showFieldError(f, 'position', 'กรุณาเลือกตำแหน่ง');
    if (!/^[a-z][a-z0-9._-]{3,29}$/.test(data.username)) return showFieldError(f, 'username', 'ชื่อผู้ใช้ไม่ถูกต้อง (4–30 ตัว ขึ้นต้นด้วย a-z)');
    if (!st.len || !st.mix || !st.user) return showFieldError(f, 'password', 'รหัสผ่านยังไม่ผ่านเกณฑ์ด้านล่าง');
    if (!st.match) return showFieldError(f, 'confirmPassword', 'การยืนยันรหัสผ่านไม่ตรงกัน');
    if (!data.acceptPrivacy) return showFieldError(f, 'acceptPrivacy', 'กรุณายอมรับนโยบายการใช้ข้อมูล');
    var btn = $('#registerBtn');
    setBtnLoading(btn, true);
    run('register', [data]).then(function (res) {
      setBtnLoading(btn, false);
      if (!res || !res.ok) {
        var err = appErr(res ? res.error : 'สมัครสมาชิกไม่สำเร็จ', res && res.code, res && res.data);
        if (!(err.data && err.data.field && showFieldError(f, err.data.field, err.message))) {
          $('#registerAlertText').textContent = err.message; $('#registerAlert').hidden = false; window.scrollTo(0, 0);
        }
        return;
      }
      $('#registerCard').hidden = true;
      $('#registerDone').hidden = false;
      $('#registerDoneText').textContent = res.data.message;
      $('#regDoneName').textContent = res.data.fullName;
      $('#regDoneUser').textContent = res.data.username;
      $('#regDoneRef').textContent = res.data.reference;
      $('#regDoneCode').textContent = res.data.staffCode || '-';
      $('#loginUsername').value = res.data.username;
      window.scrollTo(0, 0);
    }).catch(function (err) { setBtnLoading(btn, false); $('#registerAlertText').textContent = err.message; $('#registerAlert').hidden = false; });
  }

  /* ---------- Change password ---------- */
  function submitPasswordChange(e, forced) {
    e.preventDefault();
    var f = e.target;
    clearFieldErrors(f);
    var d = { currentPassword: f.currentPassword.value, newPassword: f.newPassword.value, confirmPassword: f.confirmPassword.value };
    if (!d.currentPassword) return showFieldError(f, 'currentPassword', 'กรุณากรอกรหัสผ่านปัจจุบัน');
    if (d.newPassword.length < 8 || !/[A-Za-z]/.test(d.newPassword) || !/\d/.test(d.newPassword)) return showFieldError(f, 'newPassword', 'รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัว และมีทั้งตัวอักษรและตัวเลข');
    if (d.newPassword !== d.confirmPassword) return showFieldError(f, 'confirmPassword', 'การยืนยันรหัสผ่านไม่ตรงกัน');
    var btn = $('button[type=submit]', f);
    setBtnLoading(btn, true);
    api('auth.changePassword', d, { silent: true }).then(function (r) {
      setBtnLoading(btn, false);
      f.reset();
      S.token = r.token;
      session.set('wsh_token', S.token);
      toast(r.message + ' — ระบบได้ออกจากระบบบนอุปกรณ์อื่นทั้งหมดแล้ว', 'success', 5000);
      // รหัสผ่านใหม่ทำให้การจำเครื่องเดิมใช้ไม่ได้ → จำเครื่องนี้ใหม่ (ถ้าผู้ใช้เลือกจำไว้)
      if (hasDevice() || (forced && local.get('wsh_remember') === '1')) {
        setDevice(null);
        api('auth.rememberDevice', {}, { silent: true }).then(function (x) { setDevice(x.device); renderDeviceBox(); }).catch(function () { /* ใช้งานต่อได้ตามปกติ */ });
      }
      if (forced) enterApp({ user: r.user, sessionTimeoutMin: S.timeoutMin, mustChangePassword: false });
    }).catch(function (err) { setBtnLoading(btn, false); if (err.code !== 'AUTH') handleFormError(f, err); });
  }

  /* ---------- GPS ---------- */
  function inAppBrowser() { return /Line\/|FBAN|FBAV|Instagram|KAKAOTALK|MicroMessenger/i.test(navigator.userAgent); }

  function updateGpsPermission() {
    var setStatus = function (cls, ic, text, sub) {
      var i = $('#gpsIcon'); i.className = 'gps-pulse ' + cls; i.innerHTML = icon(ic);
      $('#gpsStatusText').textContent = text; $('#gpsStatusSub').textContent = sub;
    };
    if (!('geolocation' in navigator)) { setStatus('bad', 'location_disabled', 'อุปกรณ์/เบราว์เซอร์นี้ไม่รองรับ GPS', 'กรุณาใช้ Chrome หรือ Safari บนโทรศัพท์มือถือ'); return; }
    if (inAppBrowser()) { setStatus('wait', 'open_in_browser', 'กำลังเปิดผ่านแอปแชท (เช่น LINE)', 'แนะนำให้เปิดลิงก์ด้วย Chrome หรือ Safari เพื่อให้ GPS ทำงานได้ถูกต้อง'); return; }
    if (!navigator.permissions || !navigator.permissions.query) { setStatus('wait', 'location_searching', 'พร้อมขอตำแหน่งเมื่อกดลงเวลา', 'เบราว์เซอร์จะถามสิทธิ์ตำแหน่ง กรุณากด “อนุญาต”'); return; }
    navigator.permissions.query({ name: 'geolocation' }).then(function (p) {
      var apply = function () {
        if (p.state === 'granted') setStatus('ok', 'location_on', 'อนุญาตการเข้าถึงตำแหน่งแล้ว', 'ระบบจะอ่านตำแหน่งเฉพาะตอนกดปุ่มเท่านั้น');
        else if (p.state === 'denied') setStatus('bad', 'location_off', 'ตำแหน่งถูกปิดกั้น', 'กด “วิธีเปิด GPS” เพื่อดูวิธีอนุญาตตำแหน่ง');
        else setStatus('wait', 'location_searching', 'ยังไม่ได้อนุญาตตำแหน่ง', 'เมื่อกดลงเวลา เบราว์เซอร์จะถามสิทธิ์ กรุณากด “อนุญาต”');
      };
      apply();
      p.onchange = apply;
    }).catch(function () { setStatus('wait', 'location_searching', 'พร้อมขอตำแหน่งเมื่อกดลงเวลา', 'เบราว์เซอร์จะถามสิทธิ์ตำแหน่ง กรุณากด “อนุญาต”'); });
  }

  /**
   * อ่านตำแหน่งครั้งเดียวตอนกดปุ่ม: เฝ้ารอค่าความแม่นยำที่ดีขึ้นสูงสุด ~15 วินาที แล้วหยุดอ่านทันที
   * (ไม่มีการติดตามตำแหน่งต่อเนื่อง)
   */
  function acquirePosition(maxAcc, onProgress) {
    return new Promise(function (resolve, reject) {
      if (!('geolocation' in navigator)) { reject({ code: 'UNSUPPORTED' }); return; }
      var best = null, done = false, watchId = null, t1, t2;
      function finish(ok, v) {
        if (done) return; done = true;
        clearTimeout(t1); clearTimeout(t2);
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        if (ok) resolve(v); else reject(v);
      }
      t1 = setTimeout(function () { if (best) finish(true, best); }, 15000);
      t2 = setTimeout(function () { if (best) finish(true, best); else finish(false, { code: 3 }); }, 30000);
      watchId = navigator.geolocation.watchPosition(function (pos) {
        var p = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
        if (!best || p.accuracy < best.accuracy) best = p;
        if (onProgress) onProgress(best);
        if (best.accuracy <= maxAcc) finish(true, best);
      }, function (err) {
        if (err.code === 1) finish(false, err);
        else if (err.code === 2 && !best) finish(false, err);
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 25000 });
    });
  }

  function progressModal(type) {

      close: m.close
    };
  }

  function doCheckoutNoGps() {
    var s = S.dash.settings, now = bkkTimeHM();
    var early = S.dash.today.isWorkday && now < s.workEnd;
    confirmDialog(early ? {
      title: 'ยังไม่ถึงเวลาเลิกงาน', icon: 'schedule', confirmText: 'ลงเวลาออก',
      html: 'ขณะนี้เวลา <b>' + now + ' น.</b> ยังไม่ถึงเวลาเลิกงาน (' + esc(s.workEnd) + ' น.)<br>ระบบจะบันทึกสถานะ <b>“ออกก่อนเวลา”</b> ต้องการลงเวลาออกงานใช่หรือไม่'
    } : {
      title: 'ยืนยันลงเวลาออกงาน', icon: 'logout', confirmText: 'ลงเวลาออก',
      html: 'ลงเวลาออกงานเวลา <b>' + now + ' น.</b> ใช่หรือไม่<br><span class="small muted">ระบบบันทึกตามเวลาของเซิร์ฟเวอร์</span>'
    }).then(function (go) {
      if (!go) return;
      S.attBusy = true; updateAttendanceButtons();
      api('att.checkOut', {}, { loadingText: 'กำลังบันทึกเวลาออกงาน...' }).then(function (r) {
        showAttendanceSuccess(r);
        return loadDashboard(true);
      }, function (e) {
        showAttendanceFailure(e);
        if (e.code === 'DUPLICATE') loadDashboard(true);
      }).then(function () { S.attBusy = false; updateAttendanceButtons(); });
    });
  }

  function doAttendance(type) {
    if (S.attBusy || !S.dash) return;
    var s = S.dash.settings;
    if (type === 'OUT' && !s.checkoutRequiresGps) { doCheckoutNoGps(); return; }
    var pre = Promise.resolve(true);
    if (type === 'IN' && S.dash.today.isWorkday && bkkTimeHM() > s.lateAfter) {
      pre = new Promise(function (resolve) {
        var done = false, finish = function (v) { if (!done) { done = true; resolve(v); } };
        modal({
          title: 'มาถึงตอนนี้ หรือลืมกด?', icon: 'help',
          body: '<p>ขณะนี้เวลา <b>' + bkkTimeHM() + ' น.</b> เลยเวลาที่ถือว่าสาย (' + esc(s.lateAfter) + ' น.) แล้ว</p>' +
            '<p class="mb-0">ถ้า <b>มาถึงก่อนหน้านี้แต่ลืมกด</b> ให้แจ้งเวลาที่มาถึงจริง (ผู้บริหารอนุมัติ) — ระหว่างรออนุมัติ ลงเวลาออกตอนเย็นได้ตามปกติ</p>',
          onClose: function () { finish(false); },
          actions: [
            { label: 'ลืมกด — แจ้งเวลาที่มาถึงจริง', cls: 'outline', icon: 'edit_calendar', onClick: function () { finish(false); setTimeout(function () { openCorrectionFor(bkkToday(), 'IN'); }, 0); } },
            { label: 'เพิ่งมาถึง — ลงเวลาตอนนี้', icon: 'login', onClick: function () { finish(true); } }
          ]
        });
      });
    } else if (type === 'OUT' && S.dash.today.isWorkday && bkkTimeHM() < s.workEnd) {
      pre = confirmDialog({ title: 'ยังไม่ถึงเวลาเลิกงาน', icon: 'schedule', html: 'ขณะนี้เวลา <b>' + bkkTimeHM() + ' น.</b> ยังไม่ถึงเวลาเลิกงาน (' + esc(s.workEnd) + ' น.)<br>ระบบจะบันทึกสถานะ <b>“ออกก่อนเวลา”</b> ต้องการลงเวลาออกงานใช่หรือไม่', confirmText: 'ลงเวลาออก' });
    }
    pre.then(function (go) {
      if (!go) return;
      S.attBusy = true; updateAttendanceButtons();
      var prog = progressModal(type);
      prog.set(0, 'active');
      acquirePosition(s.maxAccuracyM, function (best) {
        prog.note('ความแม่นยำปัจจุบัน ±' + Math.round(best.accuracy) + ' ม. (เกณฑ์ ≤ ' + s.maxAccuracyM + ' ม.)');
        prog.set(0, 'done'); prog.set(1, 'active');
      }).then(function (pos) {
        prog.set(0, 'done'); prog.set(1, pos.accuracy <= s.maxAccuracyM ? 'done' : 'fail'); prog.set(2, 'active');
        return api(type === 'IN' ? 'att.checkIn' : 'att.checkOut', { lat: pos.lat, lng: pos.lng, accuracy: pos.accuracy }, { silent: true })
          .then(function (r) {
            prog.set(2, 'done'); prog.set(3, 'done');
            setTimeout(function () { prog.close(); showAttendanceSuccess(r); }, 350);
            return loadDashboard(true);
          }, function (e) {
            prog.set(2, 'fail');
            setTimeout(function () { prog.close(); showAttendanceFailure(e); }, 350);
            if (e.code === 'DUPLICATE') loadDashboard(true);
          });
      }, function (geoErr) {
        prog.set(0, 'fail');
        prog.close();
        showGeoHelp(geoErr);
      }).then(function () { S.attBusy = false; updateAttendanceButtons(); updateGpsPermission(); });
    });
  }

    // ลาวันเดียว (วันเริ่ม = วันสิ้นสุด) แล้วเปลี่ยนวันเริ่ม → วันสิ้นสุดเลื่อนตาม
    $('#leaveStart').addEventListener('focus', function () { $('#leaveStart').dataset.prev = $('#leaveStart').value; });

      $(sel).addEventListener('change', function () {
        var st = $('#leaveStart'), en = $('#leaveEnd');
        if (sel === '#leaveStart' && (!en.value || en.value < st.value || en.value === st.dataset.prev)) en.value = st.value;
        if (sel === '#leaveStart') st.dataset.prev = st.value;
        syncQuickDay(); setThaiHint(st); setThaiHint(en); syncPeriod();

    });

  function applyQuickDay(v) {

    $('#leaveStart').value = d; $('#leaveEnd').value = d; $('#leaveStart').dataset.prev = d;
    setThaiHint($('#leaveStart')); setThaiHint($('#leaveEnd')); syncPeriod(); updateLeaveDateSummary();
  }

  function renderLeaveStats(st) {

  /** พิมพ์ HTML ผ่าน #printArea (orientation: 'portrait' | 'landscape') */
  function printHtml(html, orientation) {
    var area = document.getElementById('printArea');
    area.innerHTML = html;
    var pageStyle = document.createElement('style');
    pageStyle.id = 'printPageStyle';
    pageStyle.textContent = '@page { size: A4 ' + (orientation || 'landscape') + '; margin: ' + (orientation === 'portrait' ? '14mm 16mm' : '12mm') + '; }';
    document.head.appendChild(pageStyle);
    document.body.classList.add('printing');
    var done = false;
    var cleanup = function () {
      if (done) return; done = true;
      document.body.classList.remove('printing'); area.innerHTML = '';
      if (pageStyle.parentNode) pageStyle.parentNode.removeChild(pageStyle);
      window.removeEventListener('afterprint', cleanup);
    };
    window.addEventListener('afterprint', cleanup);
    setTimeout(function () { window.print(); setTimeout(cleanup, 1500); }, 100);
  }

  }
  function submitCorrection(e) {
    e.preventDefault();
    var f = e.target; clearFieldErrors(f);
    var data = { date: f.date.value, time: f.time.value, type: ($('input[name=type]:checked', f) || {}).value, reason: f.reason.value.trim() };
    if (!data.date) return showFieldError(f, 'date', 'กรุณาเลือกวันที่');
    if (data.date > bkkToday()) return showFieldError(f, 'date', 'ไม่สามารถเลือกวันในอนาคต');
    if (!/^\d{2}:\d{2}$/.test(data.time)) return showFieldError(f, 'time', 'กรุณาระบุเวลา');
    if (data.reason.length < 5) return showFieldError(f, 'reason', 'กรุณาระบุเหตุผลอย่างน้อย 5 ตัวอักษร');
    var btn = $('button[type=submit]', f);
    setBtnLoading(btn, true);
    fileToPayload(f.attachment.files[0]).then(function (att) {
      data.attachment = att;
      return api('corr.submit', data, { silent: true }).then(function (r) { loadDashboard(true); return r; });
    }).then(function (r) {
      toast(r.message, 'success');
      f.reset(); $('[data-file-label]', f).textContent = 'แนบไฟล์ PDF หรือรูปภาพ (ไม่เกิน 5 MB)';
      initCorrectionForm(); loadMyCorrections();
    }).catch(function (err) { if (err.code !== 'AUTH') handleFormError(f, err); })
      .then(function () { setBtnLoading(btn, false); });
  }
  function corrCard(c, mine) {
    return '<div class="req-card"><div class="head"><div><div class="title">แก้ไข' + esc(c.typeLabel) + ' เป็น ' + esc(c.time) + ' น.</div>' +
      '<div class="meta">' + icon('event') + ' ' + esc(c.dateLabel) + '</div>' + (mine ? '' : '<div class="meta">' + icon('person') + ' ' + esc(c.fullName) + ' (' + esc(c.staffCode) + ')</div>') +
      (!mine ? '<div class="meta">เวลาปัจจุบันในระบบ: เข้า ' + esc(c.currentIn || '-') + ' / ออก ' + esc(c.currentOut || '-') + '</div>' : '') + '</div>' +
      badge(c.status, c.statusLabel) + '</div><div class="reason">' + esc(c.reason) + '</div>' +
      '<div class="meta">' + (c.recordedBy ? 'บันทึกแทนโดย ' + esc(c.recordedBy) + ' ' + esc(c.requestedLabel) : 'ยื่นเมื่อ ' + esc(c.requestedLabel) + (c.reviewedByName ? ' · พิจารณาโดย ' + esc(c.reviewedByName) + ' ' + esc(c.reviewedLabel) : '')) + '</div>' +
      (c.reviewNote ? '<div class="meta">ความเห็น: ' + esc(c.reviewNote) + '</div>' : '') +
      '<div class="actions">' + (c.hasAttachment ? '<button type="button" class="btn outline sm" data-view-att="correction" data-id="' + esc(c.requestId) + '">' + icon('attach_file') + 'หลักฐาน</button>' : '') +
      (mine && c.status === 'PENDING' ? '<button type="button" class="btn ghost sm" data-cancel-corr="' + esc(c.requestId) + '">' + icon('close') + 'ยกเลิกคำร้อง</button>' : '') + '</div></div>';
  }
  function loadMyCorrections() {
    api('corr.my', {}, { silent: true }).then(function (list) {
      var host = $('#myCorrections');
      host.innerHTML = list.length ? list.map(function (c) { return corrCard(c, true); }).join('') : emptyState('ยังไม่มีคำร้อง', 'fact_check');
      bindRequestButtons(host, loadMyCorrections);
    }).catch(function (e) { if (e.code !== 'AUTH') toast(e.message, 'error'); });
  }

  /* ------------------------------------------------------------------ admin (lazy load) */
  /** เปิดหน้าผู้บริหาร/ผู้ดูแล (sec = ส่วนที่ต้องการเปิดทันที เช่น 'leaves') */
  function openAdmin(sec) {
    sec = typeof sec === 'string' ? sec : null;
    if (S.adminLoaded && window.Admin) { showView('admin'); if (sec) window.Admin.go(sec); else window.Admin.show(); return; }
    api('admin.view', {}, { loadingText: 'กำลังโหลดหน้าผู้ดูแลระบบ...' }).then(function (v) {
      $('#adminRoot').innerHTML = v.html;
      // สคริปต์ของหน้า Admin: แยกไฟล์ (v.script) หรือฝังใน HTML (ชุดติดตั้งแบบง่าย)
      var codes = [];
      $$('#adminRoot script').forEach(function (el) { codes.push(el.textContent); el.remove(); });
      if (v.script) codes.push(String(v.script).replace(/^\s*<script>/, '').replace(/<\/script>\s*$/, ''));
      codes.forEach(function (code) {
        var s = document.createElement('script');
        s.text = code;
        document.body.appendChild(s);
      });
      S.adminLoaded = true;
      showView('admin');
      window.Admin.init({ role: v.role, roleLabel: v.roleLabel, user: S.user, sec: sec });
    }).catch(function (e) { if (e.code !== 'AUTH') toast(e.message, 'error'); });
  }
  function backToUser() { showView('app'); switchTab('home'); }

  /* ------------------------------------------------------------------ export to Admin script */
  window.App = {
    S: S, api: api, toast: toast, modal: modal, confirmDialog: confirmDialog, promptDialog: promptDialog,
    esc: esc, icon: icon, badge: badge, emptyState: emptyState, thDate: thDate, hm: hm, fmtDistance: fmtDistance,
    setBtnLoading: setBtnLoading, clearFieldErrors: clearFieldErrors, showFieldError: showFieldError, handleFormError: handleFormError,
    downloadBase64: downloadBase64, viewAttachment: viewAttachment, loadChartJs: loadChartJs, acquirePosition: acquirePosition,
    leaveCard: leaveCard, corrCard: corrCard, bkkToday: bkkToday, bkkParts: bkkParts, serverNow: serverNow,
    fillMonthYear: fillMonthYear, TH_M: TH_M, TH_MS: TH_MS, backToUser: backToUser, doLogout: doLogout, showGeoHelp: showGeoHelp,
    parseYmd: parseYmd, LEAVE_TYPE_META: LEAVE_TYPE_META, leaveConfirmDialog: leaveConfirmDialog, addDaysYmd: addDaysYmd,
    segSelect: segSelect, setThaiHint: setThaiHint, bindPrintLeave: bindPrintLeave, printHtml: printHtml, copyText: copyText, openHelp: openHelp
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
